BT2446.FilterName="ITU-R BT.2446 HDR 转 SDR"

BT2446.Method="色调映射"
BT2446.Method.Desc="方法 A（感知匹配）：用一条全局曲线拟合人眼感知亮度，适合大多数 HDR 片源的通用默认值。方法 B（实时稳健转换）：基于拐点与高光强度的转换，可选 HLG 解码，为直播/游戏画面设计。方法 C（肤色可调映射）：三段式曲线，各色调区间可独立调节，适合精修肤色与高光滚降。"
BT2446.MethodA="A — 感知匹配"
BT2446.MethodB="B — 实时"
BT2446.MethodC="C — 肤色"

BT2446.HdrPeak="HDR 峰值"
BT2446.HdrPeak.Desc="HDR 输入的峰值亮度，单位 cd/m²（nits）。HDR10 片源通常为 1000，高亮母版可达 4000。方法 A 与方法 C 使用此值。"
BT2446.SdrPeak="SDR 峰值"
BT2446.SdrPeak.Desc="转换后 SDR 画面允许达到的峰值亮度，单位 cd/m²。100 nits 对应 BT.1886 与常见 SDR 显示器；目标设备更暗时可调低。"

BT2446.BKnee="拐点"
BT2446.BKnee.Desc="方法 B：开始压缩高光的亮度阈值（cd/m²）。数值越高，画面线性区间保留越多，只压缩最亮的部分。"
BT2446.BStrength="高光强度"
BT2446.BStrength.Desc="方法 B：高光增益在拐点之上额外叠加的最大亮度（cd/m²）。数值越大，压缩前高光被提得越亮。"
BT2446.BSlope="对数斜率"
BT2446.BSlope.Desc="方法 B：对数高光压缩器的斜率。1.00 为中性；小于 1 压缩更狠，大于 1 保留更多高光。"
BT2446.BHlgShaping="解码 HLG (291 nits)"
BT2446.BHlgShaping.Desc="方法 B：将输入按 HLG 处理，并以标准 291 cd/m² 标称峰值解码。仅在片源不是 HLG（例如 PQ 或已是线性信号）时关闭。"
BT2446.BInputLw="HLG 峰值 (Lw)"
BT2446.BInputLw.Desc="方法 B：解码 HLG 输入时使用的标称峰值亮度 Lw（cd/m²）。1000 对应 BT.2100 参考监视器。"

BT2446.CAlpha="串扰去饱和"
BT2446.CAlpha.Desc="方法 C：色调映射前施加的串扰去饱和。0 为关闭；数值越大，中间调里过饱和的颜色越向中性靠拢（0.10 左右是常见起点）。"
BT2446.CK1="线性增益"
BT2446.CK1.Desc="方法 C：色调映射拐点之前施加在 HDR 信号上的线性增益。大于 1 会提亮中间调，并把更多内容推进压缩区间。"
BT2446.CKnee="SDR 拐点"
BT2446.CKnee.Desc="方法 C：SDR 拐点亮度（cd/m²），即输出开始滚降的位置。这是方法 C 的主要亮度控制项。"
BT2446.CHdrReferenceWhite="HDR 参考白"
BT2446.CHdrReferenceWhite.Desc="方法 C：HDR 参考白亮度（cd/m²）。203 nits 为 BT.2408 的图形白基准；曲线会反解参数，使该值对应到 SDR 参考白。"
BT2446.CSdrReferenceWhite="SDR 参考白 (%)"
BT2446.CSdrReferenceWhite.Desc="方法 C：HDR 参考白映射到 SDR 时的信号电平（占峰值的百分比）。96% 可在削波前留一点余量。"
BT2446.CWhiteShift="高光去饱和"
BT2446.CWhiteShift.Desc="方法 C：对最亮高光额外去饱和。0 保持原有饱和度，1 使峰值完全去饱和。"
