BT2446.FilterName="ITU-R BT.2446 HDR → SDR"

BT2446.Method="トーンマッピング"
BT2446.Method.Desc="方法 A（知覚マッチング）：知覚的な明るさに合わせた単一のグローバルカーブ。ほとんどの HDR 素材でそのまま使える既定値です。方法 B（リアルタイム変換）：ニーとハイライト強度による変換で、HLG デコードにも対応。ライブ配信やゲーム映像向けです。方法 C（肌色調整マッピング）：3 分割カーブで階調域ごとに個別調整でき、肌色とハイライトのロールオフを詰めたいときに使います。"
BT2446.MethodA="A — 知覚"
BT2446.MethodB="B — ライブ"
BT2446.MethodC="C — 肌色"

BT2446.HdrPeak="HDR ピーク"
BT2446.HdrPeak.Desc="HDR 入力のピーク輝度（cd/m²、nits）。HDR10 なら通常 1000、高輝度マスターでは 4000 まで。方法 A と C で使用します。"
BT2446.SdrPeak="SDR ピーク"
BT2446.SdrPeak.Desc="変換後の SDR 映像が到達してよいピーク輝度（cd/m²）。100 nits は BT.1886 と一般的な SDR ディスプレイに相当します。暗い表示先では下げてください。"

BT2446.BKnee="ニー"
BT2446.BKnee.Desc="方法 B：ハイライト圧縮を開始する輝度（cd/m²）。値を上げるほどリニアな領域が広く残り、最も明るい部分だけが圧縮されます。"
BT2446.BStrength="ハイライト強度"
BT2446.BStrength.Desc="方法 B：ニーより上にハイライトゲインが上乗せする最大輝度（cd/m²）。大きいほど圧縮前のハイライトが明るくなります。"
BT2446.BSlope="対数スロープ"
BT2446.BSlope.Desc="方法 B：対数ハイライト圧縮のスロープ。1.00 が中立。1 未満で強く圧縮、1 超でハイライトを明るく保ちます。"
BT2446.BHlgShaping="HLG デコード (291 nits)"
BT2446.BHlgShaping.Desc="方法 B：入力を HLG として扱い、標準の公称ピーク 291 cd/m² でデコードします。入力が HLG でない場合（PQ や既にリニアな信号）のみオフにしてください。"
BT2446.BInputLw="HLG ピーク (Lw)"
BT2446.BInputLw.Desc="方法 B：HLG 入力をデコードする際の公称ピーク輝度 Lw（cd/m²）。1000 が BT.2100 の基準ディスプレイに相当します。"

BT2446.CAlpha="クロストーク減彩"
BT2446.CAlpha.Desc="方法 C：トーンマッピング前に適用するクロストーク減彩。0 で無効。大きいほど中間調の過飽和した色がニュートラルに寄ります（0.10 前後が目安）。"
BT2446.CK1="リニアゲイン"
BT2446.CK1.Desc="方法 C：トーンマッピングのニー前に HDR 信号へ掛けるリニアゲイン。1 を超えると中間調が明るくなり、圧縮域に入る部分が増えます。"
BT2446.CKnee="SDR ニー"
BT2446.CKnee.Desc="方法 C：SDR ニーの輝度（cd/m²）、つまり出力がロールオフし始める位置。方法 C の主な明るさ調整項目です。"
BT2446.CHdrReferenceWhite="HDR 基準白"
BT2446.CHdrReferenceWhite.Desc="方法 C：HDR 基準白の輝度（cd/m²）。203 nits は BT.2408 のグラフィックス白。この値が SDR 基準白に写るようカーブを逆算します。"
BT2446.CSdrReferenceWhite="SDR 基準白 (%)"
BT2446.CSdrReferenceWhite.Desc="方法 C：HDR 基準白を SDR へ写すときの信号レベル（ピークに対する %）。96% にするとクリップ前に少し余裕が残ります。"
BT2446.CWhiteShift="ハイライト減彩"
BT2446.CWhiteShift.Desc="方法 C：最も明るいハイライトへの追加減彩。0 で彩度を維持、1 でピークが完全に無彩色になります。"
