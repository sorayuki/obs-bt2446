BT2446.FilterName="ITU-R BT.2446 HDR to SDR"

BT2446.Method="Tone mapping"
BT2446.Method.Desc="Method A (perceptual matching): a single global curve fitted to perceived brightness; a good default for most HDR footage. Method B (robust live conversion): knee and highlight-strength based conversion with optional HLG decoding, built for live or gaming input. Method C (adjustable skin-tone mapping): a three-piece curve with separable tonal-zone controls, for tuning skin tones and highlight roll-off."
BT2446.MethodA="A — Perceptual"
BT2446.MethodB="B — Live"
BT2446.MethodC="C — Skin tone"

BT2446.HdrPeak="HDR peak"
BT2446.HdrPeak.Desc="Peak luminance of the HDR input in cd/m² (nits). Typically 1000 for HDR10 content and up to 4000 for high-brightness masters. Used by methods A and C."
BT2446.SdrPeak="SDR peak"
BT2446.SdrPeak.Desc="Peak luminance the converted SDR image may reach, in cd/m². 100 nits matches BT.1886 and typical SDR displays; lower it for dimmer targets."

BT2446.BKnee="Knee"
BT2446.BKnee.Desc="Method B: luminance (cd/m²) where highlight compression starts. Higher values keep more of the image linear and compress only the brightest highlights."
BT2446.BStrength="Highlight strength"
BT2446.BStrength.Desc="Method B: maximum luminance (cd/m²) added on top of the knee by the highlight gain. Larger values brighten highlights more before they are compressed."
BT2446.BSlope="Log slope"
BT2446.BSlope.Desc="Method B: slope of the logarithmic highlight compressor. 1.00 is neutral; below 1 compresses highlights harder, above 1 keeps them brighter."
BT2446.BHlgShaping="Decode HLG (291 nits)"
BT2446.BHlgShaping.Desc="Method B: treat the input as HLG and decode it at the standard 291 cd/m² nominal peak. Disable only when the source is not HLG (for example PQ or already-linear content)."
BT2446.BInputLw="HLG peak (Lw)"
BT2446.BInputLw.Desc="Method B: nominal peak luminance (Lw) used when decoding HLG input, in cd/m². 1000 matches the BT.2100 reference display."

BT2446.CAlpha="Crosstalk desat."
BT2446.CAlpha.Desc="Method C: crosstalk desaturation applied before tone mapping. 0 disables it; higher values pull over-saturated mid-tone colours toward neutral (about 0.10 is a good start)."
BT2446.CK1="Linear gain"
BT2446.CK1.Desc="Method C: linear gain applied to the HDR signal before the tone-mapping knee. Values above 1 brighten mid-tones and push more of the image into the compressed highlight range."
BT2446.CKnee="SDR knee"
BT2446.CKnee.Desc="Method C: luminance (cd/m²) of the SDR knee, i.e. where the output starts rolling off. This is the main brightness control of method C."
BT2446.CHdrReferenceWhite="HDR ref. white"
BT2446.CHdrReferenceWhite.Desc="Method C: HDR reference white in cd/m². 203 nits is the BT.2408 graphics-white level; the curve is solved so this value lands on the SDR reference white."
BT2446.CSdrReferenceWhite="SDR ref. white (%)"
BT2446.CSdrReferenceWhite.Desc="Method C: SDR signal level (percent of peak) that the HDR reference white is mapped to. 96 % leaves a little headroom below clipping."
BT2446.CWhiteShift="Highlight desat."
BT2446.CWhiteShift.Desc="Method C: extra desaturation of the brightest highlights. 0 keeps full saturation, 1 fully desaturates the peak."
