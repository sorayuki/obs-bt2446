name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  # Tag pushes build automatically and produce a draft release. Branch pushes
  # stay manual: run this workflow by hand from the Actions tab when you want a
  # build of a branch without cutting a tag.
  push:
    tags:
      - '*'
  #  branches:
  #    - master
  #    - main
  #    - 'release/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    needs: build-project
    uses: ./.github/workflows/create-release.yaml
    with:
      version: ${{ github.ref_name }}
      pluginName: ${{ needs.build-project.outputs.pluginName }}
      commitHash: ${{ needs.build-project.outputs.commitHash }}
      commitSha: ${{ needs.build-project.outputs.commitSha }}
    secrets: inherit
    permissions:
      contents: write
