name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  # Only tag pushes build anything. A push to a branch (main, release/**,
  # feature branches) triggers nothing: no build, no release. Manual runs go
  # through the "Dispatch" workflow, and they are gated to tags as well.
  push:
    tags:
      - '*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    needs: build-project
    uses: ./.github/workflows/create-release.yaml
    with:
      version: ${{ github.ref_name }}
      pluginName: ${{ needs.build-project.outputs.pluginName }}
      commitHash: ${{ needs.build-project.outputs.commitHash }}
      commitSha: ${{ needs.build-project.outputs.commitSha }}
    secrets: inherit
    permissions:
      contents: write
