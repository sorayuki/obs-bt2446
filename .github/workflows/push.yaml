name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  # Automatic push/tag runs are disabled; run this workflow by hand from the
  # Actions tab (or use the "Dispatch" workflow) instead.
  # push:
  #   branches:
  #     - master
  #     - main
  #     - 'release/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  # Automatic builds on push (including tag pushes and the resulting release
  # drafts) are disabled. Use the "Dispatch" workflow instead:
  #   - "build"   — build artifacts only
  #   - "release" — build a tag and upload its artifacts to a release draft
