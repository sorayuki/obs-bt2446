name: Dispatch
run-name: Dispatched Repository Actions - ${{ inputs.job }} (${{ github.ref_name }}) ⌛️
on:
  workflow_dispatch:
    inputs:
      job:
        description: Dispatch job to run
        required: true
        type: choice
        options:
          - build
          - release
permissions:
  contents: write
jobs:
  check-and-build:
    if: inputs.job == 'build'
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: write

  check-tag:
    name: Check Selected Tag ☑️
    if: inputs.job == 'release'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify Selected Ref Is a Release Tag ☑️
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          : Verify Selected Ref Is a Release Tag ☑️
          shopt -s extglob

          if [[ "${RELEASE_REF}" != refs/tags/* ]]; then
            echo "::error::Select a tag in 'Use workflow from' to create a release draft."
            exit 1
          fi

          case "${RELEASE_TAG}" in
            +([0-9]).+([0-9]).+([0-9]) | +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) ) ;;
            *)
              echo "::error::'${RELEASE_TAG}' is not a valid release tag (expected X.Y.Z or X.Y.Z-{rc,beta}N)."
              exit 1
              ;;
          esac

  build-release:
    name: Build Release 🧱
    if: inputs.job == 'release'
    needs: check-tag
    uses: ./.github/workflows/build-project.yaml
    with:
      gitRef: ${{ github.ref }}
      codesign: 'true'
      notarize: 'true'
      package: 'true'
      config: 'Release'
    secrets: inherit
    permissions:
      contents: write

  create-release:
    name: Create Release 🛫
    if: inputs.job == 'release'
    needs: [check-tag, build-release]
    uses: ./.github/workflows/create-release.yaml
    with:
      version: ${{ github.ref_name }}
      pluginName: ${{ needs.build-release.outputs.pluginName }}
      commitHash: ${{ needs.build-release.outputs.commitHash }}
      commitSha: ${{ needs.build-release.outputs.commitSha }}
    secrets: inherit
    permissions:
      contents: write
